<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- user-scalable=no: スコアを素早く連打したときにダブルタップ拡大が
     起きないようにする。台の脇で連打する道具なので拡大されると使えない。
     文字サイズは16px以上を確保しているため、拡大できなくても読める -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c84c0c">
<title>ビリヤードスコア記録</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- iPhoneでホーム画面から開いたときに全画面にする -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ビリヤード">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ================= 試合作成 ================= -->
  <section id="screenSetup" class="screen active">
    <div class="topbar">
      <h1>ビリヤードスコア記録</h1>
      <div style="display:flex;gap:6px">
        <button id="toPlayersBtn2" class="small ghost">選手</button>
        <button id="toHistoryBtn" class="small ghost">履歴</button>
      </div>
    </div>

    <div class="setup-body">
      <!-- 中断した試合があれば、いちばん上で再開できるようにする -->
      <div id="resumeCard" class="resume-card" hidden>
        <div class="rc-head">中断中の試合があります</div>
        <div class="rc-body" id="resumeInfo"></div>
        <div class="rc-actions">
          <button id="resumeBtn" class="primary">続きから再開する</button>
          <button id="resumeDiscardBtn" class="ghost small">この試合を終了して保存</button>
        </div>
      </div>

      <div class="section-title">競技種目</div>
      <div id="gameRecent" class="recent-games"></div>
      <div id="gameGroups" class="game-groups"></div>
      <p id="gameNote" class="hint"></p>

      <div class="section-title">プレーヤー</div>
      <div id="playerFields"></div>

      <div class="section-title">勝利条件</div>
      <div id="goalArea"></div>

      <div id="ballHandicapSection">
        <div class="section-title">ボールハンデ</div>
        <div id="ballHandicapArea"></div>
      </div>

      <div id="ballSetSection" hidden>
        <div class="section-title">使うボール</div>
        <div id="ballSetArea"></div>
      </div>

      <div class="section-title">ブレイク</div>
      <div class="field">
        <label>ブレイク方式</label>
        <div id="breakTypeToggle" class="toggle-group">
          <button type="button" data-v="winner" aria-pressed="true">ウィナーズ<br><span class="btn-sub">勝った側が次もブレイク</span></button>
          <button type="button" data-v="alternate" aria-pressed="false">オルタネート<br><span class="btn-sub">交互にブレイク</span></button>
        </div>
        <p id="breakTypeNote" class="hint"></p>
      </div>
      <div class="field">
        <label>先にブレイクする人</label>
        <div id="firstSideToggle" class="toggle-group">
          <button type="button" data-v="A" aria-pressed="true">プレーヤーA</button>
          <button type="button" data-v="B" aria-pressed="false">プレーヤーB</button>
        </div>
      </div>

      <div class="section-title">時計</div>
      <div class="field">
        <label>使う時計</label>
        <div id="clockTypeToggle" class="toggle-group">
          <button type="button" data-v="none" aria-pressed="true">使わない</button>
          <button type="button" data-v="shot" aria-pressed="false">ショット<span class="btn-sub">1ショットごと</span></button>
          <button type="button" data-v="chess" aria-pressed="false">チェス<span class="btn-sub">持ち時間制</span></button>
        </div>
      </div>

      <div id="scDetail" hidden>
        <div class="row">
          <div class="field">
            <label>持ち時間（秒）</label>
            <input type="number" id="scSeconds" value="45" min="10" max="180" step="5">
          </div>
          <div class="field">
            <label>残り何秒で警告</label>
            <input type="number" id="scWarn" value="15" min="0" max="60" step="5">
          </div>
        </div>
        <div class="field">
          <label>延長の数え方</label>
          <div id="scScopeToggle" class="toggle-group">
            <button type="button" data-v="rack" aria-pressed="true">ラックごと<span class="btn-sub">ラックが変わると戻る</span></button>
            <button type="button" data-v="match" aria-pressed="false">試合を通して<span class="btn-sub">使い切ったら終わり</span></button>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>延長の回数（1人あたり）</label>
            <input type="number" id="scExtCount" value="1" min="0" max="9" step="1">
          </div>
          <div class="field">
            <label>延長の時間（秒）</label>
            <input type="number" id="scExtSec" value="45" min="10" max="180" step="5">
          </div>
        </div>
        <div class="field">
          <label>延長の使い方</label>
          <div id="scModeToggle" class="toggle-group">
            <button type="button" data-v="declare" aria-pressed="true">宣言して使う</button>
            <button type="button" data-v="auto" aria-pressed="false">自動で延長</button>
          </div>
          <p class="hint">時間切れになると、その時点でファウルとして記録します。</p>
        </div>
      </div>

      <div id="ccDetail" hidden>
        <div class="row">
          <div class="field">
            <label>持ち時間（分・1人あたり）</label>
            <input type="number" id="ccMinutes" value="30" min="1" max="180" step="5">
          </div>
          <div class="field">
            <label>残り何秒で警告</label>
            <input type="number" id="ccWarn" value="60" min="0" max="300" step="10">
          </div>
        </div>
        <div class="field">
          <label>秒読み（秒・0なら無し）</label>
          <input type="number" id="ccByoyomi" value="0" min="0" max="120" step="10">
          <p class="hint">持ち時間を使い切っても、1回の番ごとにこの秒数だけ撞けます。0にすると使い切った時点で時間切れ負けです。</p>
        </div>
      </div>

      <div style="height:12px"></div>
      <button id="startMatchBtn" class="primary" style="width:100%">この内容で試合を始める</button>
      <div style="height:20px"></div>
    </div>
  </section>

  <!-- ================= 試合中 ================= -->
  <section id="screenMatch" class="screen">
    <div class="topbar">
      <div>
        <h1 id="matchTitle">9ボール</h1>
        <div class="sub" id="matchSubtitle"></div>
      </div>
      <button id="quitMatchBtn" class="small ghost">中断</button>
    </div>

    <div class="scoreboard">
      <!-- スコア欄そのものがボタン。タップで1点（1ラック）加算する -->
      <button type="button" class="score-panel side-a" id="panelA">
        <span class="sp-head">
          <span class="breakmark" id="breakMarkA"></span>
          <span class="name" id="nameA">プレーヤーA</span>
          <span class="target" id="targetA"></span>
        </span>
        <span class="handicap" id="handicapA" hidden></span>
        <span class="val" id="scoreA">0</span>
        <span class="progress"><i id="barA" style="width:0%"></i></span>
      </button>

      <button type="button" class="score-panel side-b" id="panelB">
        <span class="sp-head">
          <span class="breakmark" id="breakMarkB"></span>
          <span class="name" id="nameB">プレーヤーB</span>
          <span class="target" id="targetB"></span>
        </span>
        <span class="handicap" id="handicapB" hidden></span>
        <span class="val" id="scoreB">0</span>
        <span class="progress"><i id="barB" style="width:0%"></i></span>
      </button>

      <div class="meta-line">
        <span id="rackInfo">ラック 1</span>
        <span id="inningInfo" class="inning-info" hidden></span>
        <button id="breakToggleBtn" class="break-toggle">
          <span class="bt-label">ブレイク</span>
          <span class="bt-name" id="breakToggleName">—</span>
          <span class="bt-swap">入れ替え</span>
        </button>
      </div>
      <!-- いま誰がブレイクかを、台の脇から見て一目で分かるように大きく出す -->
      <div class="break-banner" id="breakBanner">
        <span class="bb-icon" aria-hidden="true"></span>
        <span class="bb-text"><b id="breakBannerName">—</b> のブレイク</span>
      </div>

      <!-- いま誰が撞いているか。JPAのようにイニングを数える種目では
           これが分からないと記録できない -->
      <div class="turn-banner" id="turnBanner" hidden>
        <span class="tb-label">いまの番</span>
        <b class="tb-name" id="turnBannerName">—</b>
      </div>
    </div>

    <!-- 公式スコアシートに沿った表示（JPA・ボウラード） -->
    <div id="sheetArea" class="sheet-area" hidden></div>

    <div id="shotClockBar" class="shotclock hidden">
      <span class="time" id="scTime">45</span>
      <span class="sc-info" id="scInfo"></span>
      <span class="sc-btns">
        <button id="scPauseBtn" class="small">一時停止</button>
        <button id="scExtBtn" class="small">延長</button>
      </span>
    </div>

    <div id="chessClockBar" class="chessclock hidden">
      <div class="cc-side" id="ccSideA">
        <span class="cc-name" id="ccNameA">A</span>
        <span class="cc-time" id="ccTimeA">30:00</span>
      </div>
      <div class="cc-side" id="ccSideB">
        <span class="cc-name" id="ccNameB">B</span>
        <span class="cc-time" id="ccTimeB">30:00</span>
      </div>
      <button id="ccPauseBtn" class="small">一時停止</button>
    </div>

    <div class="play-area">
      <p class="tap-hint" id="tapHint">ラックを取った側のスコアをタップしてください</p>

      <!-- 球ごとに点が違う種目（ローテーション）で使う盤面。
           どの球を入れたかを押して記録する -->
      <div id="ballGrid" class="ball-grid" hidden></div>

      <!-- ボウラードの投球入力（何個入れたかを押す） -->
      <div id="bowlPad" class="bowl-pad" hidden></div>
      <button id="turnBtn" class="turn-btn">交代 → <span id="turnNextName">相手</span></button>
      <div id="flagButtons" class="flag-buttons"></div>
    </div>

    <div class="bottom-bar">
      <button id="undoBtn">⟲ 取り消し</button>
      <button id="reviseBtn" class="ghost">⋯ 訂正</button>
      <button id="finishBtn" class="ghost">試合終了</button>
    </div>
  </section>

  <!-- ================= 履歴 ================= -->
  <section id="screenHistory" class="screen">
    <div class="topbar">
      <h1>履歴</h1>
      <div>
        <button id="exportBtn" class="small ghost">書き出し</button>
        <button id="backFromHistoryBtn" class="small ghost">戻る</button>
      </div>
    </div>
    <div class="list" id="historyList"></div>
    <div class="bottom-bar">
      <button id="newMatchBtn" class="primary">新しい試合</button>
      <button id="toPlayersBtn" class="ghost">プレーヤー</button>
      <button id="importBtn" class="ghost">読み込み</button>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
  </section>

  <!-- ================= 選手一覧 ================= -->
  <section id="screenPlayers" class="screen">
    <div class="topbar">
      <div>
        <h1>選手一覧</h1>
        <div class="sub" id="playersCount"></div>
      </div>
      <button id="backFromPlayersBtn" class="small ghost">戻る</button>
    </div>

    <div class="list">
      <!-- 登録フォーム。ふだんは畳んでおき、一覧を主役にする -->
      <button id="toggleAddPlayerBtn" class="add-player-head" aria-expanded="false">
        <span class="aph-plus" aria-hidden="true">＋</span>
        <span class="aph-label">選手を登録する</span>
      </button>

      <div id="addPlayerBody" class="add-player-body" hidden>
        <div class="field">
          <label for="newPlayerName">名前</label>
          <div class="row">
            <input type="text" id="newPlayerName" placeholder="名前を入力"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="addPlayerBtn" class="primary" style="flex:0 0 auto">登録</button>
          </div>
          <div id="newPlayerSkill"></div>
        </div>
      </div>

      <!-- 検索と並び替え。人数が増えたときに探せるようにする -->
      <div id="playerTools" class="player-tools" hidden>
        <input type="search" id="playerSearch" placeholder="名前で絞り込む"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="playerSortToggle" class="toggle-group">
          <button type="button" data-v="name" aria-pressed="true">名前順</button>
          <button type="button" data-v="recent" aria-pressed="false">最近</button>
          <button type="button" data-v="wins" aria-pressed="false">勝率</button>
        </div>
      </div>

      <div id="playerList"></div>
    </div>

    <div class="bottom-bar">
      <button id="playersToStatsBtn" class="ghost">成績を見る</button>
      <button id="playersNewMatchBtn" class="primary">新しい試合</button>
    </div>
  </section>

  <!-- ================= 成績 ================= -->
  <section id="screenStats" class="screen">
    <div class="topbar">
      <h1>成績</h1>
      <button id="backFromStatsBtn" class="small ghost">戻る</button>
    </div>
    <div class="list" id="statsBody"></div>
  </section>

</div>

<!-- 訂正モーダル -->
<div class="modal-backdrop" id="reviseModal" hidden>
  <div class="modal">
    <h2>記録の訂正</h2>
    <p class="hint">取り消したい記録を選んでください。取り消した記録も履歴には残ります。</p>
    <div class="ev-list" id="evList"></div>
    <div class="modal-actions">
      <button id="closeReviseBtn" class="ghost">閉じる</button>
    </div>
  </div>
</div>

<!-- 試合終了モーダル -->
<div class="modal-backdrop" id="finishModal" hidden>
  <div class="modal">
    <h2>試合を終了します</h2>
    <div id="finishSummary"></div>
    <div class="modal-actions">
      <button id="cancelFinishBtn" class="ghost">まだ続ける</button>
      <button id="confirmFinishBtn" class="primary">終了して保存</button>
    </div>
  </div>
</div>

<!-- どの画面からでも1つ前に戻れるボタン。
     画面ごとの「戻る」を探さなくて済むように常に同じ位置に出す -->
<button id="globalBackBtn" class="global-back" hidden>
  <span aria-hidden="true">◀</span><span class="gb-label">戻る</span>
</button>

<div class="toast-wrap" id="toastWrap"></div>

<script src="data/balls_data.js"></script>
<script src="data/rules_data.js"></script>
<script src="data/scoring_data.js"></script>
<script src="data/games_data.js"></script>
<script src="data/handicap_data.js"></script>
<script src="js/engine.js"></script>
<script src="js/shotclock.js"></script>
<script src="js/chessclock.js"></script>
<script src="js/store.js"></script>
<script src="js/ui_setup.js"></script>
<script src="js/ui_sheet.js"></script>
<script src="js/ui_match.js"></script>
<script src="js/ui_history.js"></script>
<script src="js/ui_players.js"></script>
<script src="js/app.js"></script>
<script>
// オフラインでも使えるようにする。file:// で開いた場合は登録しない（動かないため）
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* 登録できなくてもアプリ自体は動くので握りつぶす */
    });
  });
}
</script>
</body>
</html>
